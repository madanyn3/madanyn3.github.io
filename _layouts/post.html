---
layout: default
---

<article class="post">
  <p class="post-back"><a href="{{ '/blogs/' | relative_url }}">← Writing</a></p>
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
      {% if page.series %} · {{ page.series | replace: "-", " " | capitalize }}, part {{ page.serial_number }}{% endif %}
    </p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
